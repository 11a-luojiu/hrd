<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>华容道</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#222;
  color:#fff;
  font-family:system-ui,sans-serif;
  padding:16px;
  touch-action:none;
}
#info{
  text-align:center;
  margin-bottom:12px;
  font-size:18px;
}
#board{
  width:min(90vw,360px);
  height:min(112.5vw,450px);
  background:#444;
  margin:0 auto;
  position:relative;
  border:4px solid #aaa;
}
.block{
  position:absolute;
  background:#68a;
  border:2px solid #fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:22px;
  user-select:none;
  touch-action:none;
}
.block.caocao{
  background:#c44;
  color:#fff;
}
.btn-wrap{
  text-align:center;
  margin-top:16px;
}
button{
  padding:10px 20px;
  font-size:16px;
  border:none;
  border-radius:8px;
  background:#38f;
  color:white;
  margin:4px;
}
</style>
</head>
<body>
<div id="info">步数：<span id="step">0</span></div>
<div id="board"></div>
<div class="btn-wrap">
<button onclick="reset()">重新开始</button>
</div>

<script>
// 格子：4列 ×5行
const COLS = 4;
const ROWS = 5;
let boardEl = document.getElementById('board');
let stepEl = document.getElementById('step');
let step = 0;

// 方块定义：{id,w,h,x,y,name}
// x,y 是格子坐标；曹操是2×2
let blocks = [
  {id:'cc', w:2, h:2, x:1, y:0, name:'曹', cls:'caocao'},
  {id:'a', w:1, h:2, x:0, y:0, name:'赵'},
  {id:'b', w:1, h:2, x:3, y:0, name:'马'},
  {id:'c', w:2, h:1, x:1, y:2, name:'关'},
  {id:'d', w:1, h:2, x:0, y:2, name:'张'},
  {id:'e', w:1, h:2, x:3, y:2, name:'黄'},
  {id:'f', w:1, h:1, x:1, y:3, name:'兵'},
  {id:'g', w:1, h:1, x:2, y:3, name:'兵'},
  {id:'h', w:1, h:1, x:1, y:4, name:'兵'},
  {id:'i', w:1, h:1, x:2, y:4, name:'兵'},
];
let dragBlock = null;
let startX, startY;

function render(){
  boardEl.innerHTML = '';
  const bw = boardEl.clientWidth / COLS;
  const bh = boardEl.clientHeight / ROWS;
  blocks.forEach(b=>{
    let div = document.createElement('div');
    div.className = 'block ' + (b.cls||'');
    div.dataset.id = b.id;
    div.style.left = b.x * bw + 'px';
    div.style.top = b.y * bh + 'px';
    div.style.width = b.w * bw + 'px';
    div.style.height = b.h * bh + 'px';
    div.innerText = b.name;
    boardEl.appendChild(div);
  })
}

// 判断方块移动是否合法
function canMove(b, dx, dy){
  let nx = b.x + dx;
  let ny = b.y + dy;
  // 边界检查
  if(nx<0 || ny<0 || nx + b.w > COLS || ny + b.h > ROWS) return false;
  // 和其他方块碰撞
  for(let o of blocks){
    if(o.id === b.id) continue;
    if(rectOverlap(nx, ny, b.w, b.h, o.x, o.y, o.w, o.h)){
      return false;
    }
  }
  return true;
}
function rectOverlap(x1,y1,w1,h1,x2,y2,w2,h2){
  return !(x1+w1 <= x2 || x2+w2 <= x1 || y1+h1 <= y2 || y2+h2 <= y1);
}

function moveBlock(b, dx, dy){
  if(!canMove(b,dx,dy)) return false;
  b.x += dx;
  b.y += dy;
  step++;
  stepEl.textContent = step;
  render();
  checkWin();
  return true;
}

function checkWin(){
  let cc = blocks.find(x=>x.id==='cc');
  // 曹操到最下方中间出口 (x=1,y=3)
  if(cc.x === 1 && cc.y === 3){
    setTimeout(()=>alert('恭喜通关！一共走了'+step+'步'),100);
  }
}

// 触屏拖拽
boardEl.addEventListener('touchstart', e=>{
  let touch = e.touches[0];
  let tar = e.target.closest('.block');
  if(!tar) return;
  dragBlock = blocks.find(b=>b.id === tar.dataset.id);
  startX = touch.clientX;
  startY = touch.clientY;
})
boardEl.addEventListener('touchmove', e=>{
  e.preventDefault();
})
boardEl.addEventListener('touchend', e=>{
  if(!dragBlock) return;
  let touch = e.changedTouches[0];
  let dx = touch.clientX - startX;
  let dy = touch.clientY - startY;
  // 判断滑动方向
  if(Math.abs(dx) > Math.abs(dy)){
    if(dx > 30) moveBlock(dragBlock,1,0);
    else if(dx < -30) moveBlock(dragBlock,-1,0);
  }else{
    if(dy > 30) moveBlock(dragBlock,0,1);
    else if(dy < -30) moveBlock(dragBlock,0,-1);
  }
  dragBlock = null;
})

function reset(){
  step = 0;
  stepEl.textContent = step;
  blocks = [
    {id:'cc', w:2, h:2, x:1, y:0, name:'曹', cls:'caocao'},
    {id:'a', w:1, h:2, x:0, y:0, name:'赵'},
    {id:'b', w:1, h:2, x:3, y:0, name:'马'},
    {id:'c', w:2, h:1, x:1, y:2, name:'关'},
    {id:'d', w:1, h:2, x:0, y:2, name:'张'},
    {id:'e', w:1, h:2, x:3, y:2, name:'黄'},
    {id:'f', w:1, h:1, x:1, y:3, name:'兵'},
    {id:'g', w:1, h:1, x:2, y:3, name:'兵'},
    {id:'h', w:1, h:1, x:1, y:4, name:'兵'},
    {id:'i', w:1, h:1, x:2, y:4, name:'兵'},
  ];
  render();
}

window.onload = render;
window.onresize = render;
</script>
</body>
</html>
