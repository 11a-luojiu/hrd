
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字华容道</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #dceeff, #e9e1ff);
            color: #38445c;
        }

        .game-container {
            width: 100%;
            max-width: 520px;
            padding: 28px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.88);
            box-shadow: 0 12px 40px rgba(80, 100, 150, 0.15);
            text-align: center;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 30px;
            color: #526b9c;
        }

        .subtitle {
            margin-bottom: 25px;
            color: #8996ad;
            font-size: 14px;
        }

        .settings {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        select,
        button {
            font-family: inherit;
        }

        select {
            padding: 9px 14px;
            border: 1px solid #d5ddef;
            border-radius: 10px;
            background: white;
            color: #526b9c;
            font-size: 15px;
            cursor: pointer;
        }

        .restart-btn {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            background: #829bd0;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .restart-btn:hover {
            background: #6d88c0;
        }

        .info {
            display: flex;
            justify-content: space-around;
            gap: 10px;
            margin-bottom: 20px;
        }

        .info-item {
            flex: 1;
            padding: 12px 5px;
            border-radius: 12px;
            background: #f0f4fc;
        }

        .info-label {
            margin-bottom: 5px;
            color: #9aa7bd;
            font-size: 12px;
        }

        .info-value {
            color: #526b9c;
            font-size: 20px;
            font-weight: bold;
        }

        /* 棋盘 */

        .board {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: grid;
            gap: 7px;
            padding: 9px;
            border-radius: 16px;
            background: #dce5f4;
            box-shadow: inset 0 2px 8px rgba(80, 100, 150, 0.12);
            touch-action: none;
            user-select: none;
        }

        .tile {
            min-width: 0;
            min-height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            border: none;
            border-radius: 10px;
            background: linear-gradient(145deg, #ffffff, #edf2ff);
            box-shadow: 0 3px 6px rgba(80, 100, 150, 0.13);
            color: #617db4;
            font-size: clamp(13px, 5vw, 28px);
            font-weight: bold;
            cursor: pointer;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;

            transition:
                transform 0.19s cubic-bezier(0.22, 1, 0.36, 1),
                background 0.2s,
                box-shadow 0.2s;
        }

        .tile:active {
            background: #e5edff;
        }

        .tile.empty {
            background: rgba(170, 188, 220, 0.22);
            box-shadow: none;
            cursor: default;
        }

        .tile.moving {
            z-index: 2;
        }

        .message {
            min-height: 28px;
            margin-top: 18px;
            color: #8296bd;
            font-size: 14px;
        }

        .instructions {
            margin-top: 14px;
            color: #a0aabd;
            font-size: 12px;
            line-height: 1.8;
        }

        @media (max-width: 420px) {
            .game-container {
                padding: 20px 15px;
            }

            .board {
                gap: 5px;
                padding: 7px;
            }

            .tile {
                border-radius: 7px;
            }
        }
    </style>
</head>

<body>

<div class="game-container">

    <h1>数字华容道</h1>
    <div class="subtitle">一步一步，把数字排列整齐吧！</div>

    <div class="settings">
        <label for="sizeSelect">棋盘规格：</label>

        <select id="sizeSelect">
            <option value="3">3 × 3</option>
            <option value="4" selected>4 × 4</option>
            <option value="5">5 × 5</option>
            <option value="6">6 × 6</option>
            <option value="7">7 × 7</option>
            <option value="8">8 × 8</option>
            <option value="9">9 × 9</option>
        </select>

        <button class="restart-btn" id="restartBtn">
            重新开始
        </button>
    </div>

    <div class="info">
        <div class="info-item">
            <div class="info-label">步数</div>
            <div class="info-value" id="moves">0</div>
        </div>

        <div class="info-item">
            <div class="info-label">时间</div>
            <div class="info-value" id="time">00:00</div>
        </div>

        <div class="info-item">
            <div class="info-label">规格</div>
            <div class="info-value" id="sizeText">4×4</div>
        </div>
    </div>

    <div class="board" id="board"></div>

    <div class="message" id="message">
        划动方块，让它滑进旁边的空格吧！
    </div>

    <div class="instructions">
        电脑：按住方块并向一个方向划动<br>
        手机：手指在方块上向一个方向滑动<br>
        也可以点击相邻方块，或使用键盘方向键
    </div>

</div>

<script>
    // ================================
    // 游戏变量
    // ================================

    const boardElement = document.getElementById("board");
    const sizeSelect = document.getElementById("sizeSelect");
    const restartBtn = document.getElementById("restartBtn");

    const movesElement = document.getElementById("moves");
    const timeElement = document.getElementById("time");
    const sizeText = document.getElementById("sizeText");
    const messageElement = document.getElementById("message");

    let size = 4;
    let board = [];

    let moves = 0;
    let seconds = 0;
    let timer = null;

    let started = false;
    let finished = false;
    let isAnimating = false;

    // 每次动画的持续时间
    const ANIMATION_TIME = 190;

    // ================================
    // 初始化游戏
    // ================================

    function initGame() {

        size = Number(sizeSelect.value);

        moves = 0;
        seconds = 0;

        started = false;
        finished = false;
        isAnimating = false;

        clearInterval(timer);
        timer = null;

        movesElement.textContent = "0";
        timeElement.textContent = "00:00";
        sizeText.textContent = `${size}×${size}`;

        messageElement.textContent =
            "划动方块，让它滑进旁边的空格吧！";

        boardElement.style.gridTemplateColumns =
            `repeat(${size}, 1fr)`;

        createBoard();
        shuffleBoard();
        renderBoard();
    }

    // ================================
    // 创建正确顺序
    // ================================

    function createBoard() {

        board = [];

        const total = size * size;

        for (let i = 1; i < total; i++) {
            board.push(i);
        }

        board.push(0);
    }

    // ================================
    // 获取空格周围的方块
    // ================================

    function getNeighbors(emptyIndex) {

        const row = Math.floor(emptyIndex / size);
        const col = emptyIndex % size;

        const neighbors = [];

        if (row > 0) {
            neighbors.push(emptyIndex - size);
        }

        if (row < size - 1) {
            neighbors.push(emptyIndex + size);
        }

        if (col > 0) {
            neighbors.push(emptyIndex - 1);
        }

        if (col < size - 1) {
            neighbors.push(emptyIndex + 1);
        }

        return neighbors;
    }

    // ================================
    // 随机打乱
    // 通过合法移动保证一定有解
    // ================================

    function shuffleBoard() {

        let emptyIndex = board.length - 1;
        let previousIndex = -1;

        const shuffleTimes = size * size * 30;

        for (let i = 0; i < shuffleTimes; i++) {

            let neighbors = getNeighbors(emptyIndex);

            // 尽量避免马上走回上一步
            let available = neighbors.filter(
                index => index !== previousIndex
            );

            if (available.length === 0) {
                available = neighbors;
            }

            const randomIndex =
                available[Math.floor(Math.random() * available.length)];

            previousIndex = emptyIndex;

            [board[emptyIndex], board[randomIndex]] =
                [board[randomIndex], board[emptyIndex]];

            emptyIndex = randomIndex;
        }
    }

    // ================================
    // 绘制棋盘
    // ================================

    function renderBoard(animate = false) {

        // 保存旧方块的位置
        const oldPositions = new Map();

        if (animate) {
            const oldTiles = boardElement.querySelectorAll(".tile");

            oldTiles.forEach(tile => {
                const number = Number(tile.dataset.number);

                if (number !== 0) {
                    oldPositions.set(
                        number,
                        tile.getBoundingClientRect()
                    );
                }
            });
        }

        boardElement.innerHTML = "";

        board.forEach((number, index) => {

            const tile = document.createElement("button");

            tile.className = "tile";
            tile.dataset.number = number;
            tile.type = "button";

            if (number === 0) {

                tile.classList.add("empty");
                tile.disabled = true;
                tile.textContent = "";

            } else {

                tile.textContent = number;

                // 手指或鼠标划动
                addSwipeEvents(tile, index);

                // 点击操作作为辅助
                tile.addEventListener("click", () => {
                    if (!finished && !isAnimating) {
                        tryMove(index);
                    }
                });
            }

            boardElement.appendChild(tile);
        });

        // FLIP 动画：
        // 先让新方块出现在旧位置，再平滑移动到新位置

        if (animate && oldPositions.size > 0) {

            const newTiles = boardElement.querySelectorAll(".tile");

            newTiles.forEach(tile => {

                const number = Number(tile.dataset.number);

                if (number === 0) return;

                const oldRect = oldPositions.get(number);

                if (!oldRect) return;

                const newRect = tile.getBoundingClientRect();

                const dx = oldRect.left - newRect.left;
                const dy = oldRect.top - newRect.top;

                if (dx === 0 && dy === 0) return;

                tile.style.transition = "none";
                tile.style.transform = `translate(${dx}px, ${dy}px)`;
            });

            // 强制浏览器完成初始布局
            boardElement.offsetHeight;

            requestAnimationFrame(() => {

                newTiles.forEach(tile => {

                    tile.style.transition =
                        `transform ${ANIMATION_TIME}ms cubic-bezier(0.22, 1, 0.36, 1)`;

                    tile.style.transform = "";
                });
            });

            isAnimating = true;

            setTimeout(() => {
                isAnimating = false;
                checkWin();
            }, ANIMATION_TIME);
        }
    }

    // ================================
    // 划动操作
    // ================================

    function addSwipeEvents(tile, index) {

        let startX = 0;
        let startY = 0;
        let pointerId = null;

        let hasSwiped = false;

        tile.addEventListener("pointerdown", event => {

            if (finished || isAnimating) return;

            startX = event.clientX;
            startY = event.clientY;

            pointerId = event.pointerId;
            hasSwiped = false;

            tile.setPointerCapture(pointerId);
        });

        tile.addEventListener("pointerup", event => {

            if (pointerId !== event.pointerId) return;

            const dx = event.clientX - startX;
            const dy = event.clientY - startY;

            pointerId = null;

            const distance = Math.sqrt(dx * dx + dy * dy);

            // 划动距离太短，交给 click 事件处理
            if (distance < 18) return;

            hasSwiped = true;

            // 判断主要划动方向
            let direction;

            if (Math.abs(dx) > Math.abs(dy)) {

                direction = dx > 0 ? "right" : "left";

            } else {

                direction = dy > 0 ? "down" : "up";
            }

            tryMove(index, direction);
        });

        tile.addEventListener("pointercancel", () => {
            pointerId = null;
        });
    }

    // ================================
    // 根据方向寻找目标空格
    // ================================

    function getTargetIndex(index, direction) {

        const row = Math.floor(index / size);
        const col = index % size;

        if (direction === "left" && col > 0) {
            return index - 1;
        }

        if (direction === "right" && col < size - 1) {
            return index + 1;
        }

        if (direction === "up" && row > 0) {
            return index - size;
        }

        if (direction === "down" && row < size - 1) {
            return index + size;
        }

        return -1;
    }

    // ================================
    // 移动方块
    // ================================

    function tryMove(index, direction = null) {

        if (finished || isAnimating) return;

        const emptyIndex = board.indexOf(0);

        let targetIndex = -1;

        if (direction) {

            // 划动：必须朝着空格所在方向
            targetIndex = getTargetIndex(index, direction);

            if (targetIndex !== emptyIndex) {
                return;
            }

        } else {

            // 点击：只能点击空格旁边的方块
            if (!getNeighbors(emptyIndex).includes(index)) {
                return;
            }

            targetIndex = emptyIndex;
        }

        // 交换方块和空格
        [board[index], board[targetIndex]] =
            [board[targetIndex], board[index]];

        moves++;

        movesElement.textContent = moves;

        if (!started) {
            started = true;
            startTimer();
        }

        renderBoard(true);
    }

    // ================================
    // 计时器
    // ================================

    function startTimer() {

        if (timer !== null) return;

        timer = setInterval(() => {

            seconds++;

            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = seconds % 60;

            timeElement.textContent =
                `${String(minutes).padStart(2, "0")}:${String(remainingSeconds).padStart(2, "0")}`;

        }, 1000);
    }

    // ================================
    // 判断是否完成
    // ================================

    function checkWin() {

        if (finished) return;

        for (let i = 0; i < board.length - 1; i++) {

            if (board[i] !== i + 1) {
                return;
            }
        }

        if (board[board.length - 1] !== 0) {
            return;
        }

        finished = true;

        clearInterval(timer);
        timer = null;

        messageElement.textContent =
            `恭喜你！完成挑战啦！共用了 ${moves} 步！`;
    }

    // ================================
    // 键盘操作
    // ================================

    document.addEventListener("keydown", event => {

        if (finished || isAnimating) return;

        const emptyIndex = board.indexOf(0);

        const row = Math.floor(emptyIndex / size);
        const col = emptyIndex % size;

        let targetIndex = -1;

        // 注意：这里的方向是空格移动方向，
        // 所以实际移动的是空格另一侧的方块

        if (event.key === "ArrowLeft" && col < size - 1) {
            targetIndex = emptyIndex + 1;
        }

        if (event.key === "ArrowRight" && col > 0) {
            targetIndex = emptyIndex - 1;
        }

        if (event.key === "ArrowUp" && row < size - 1) {
            targetIndex = emptyIndex + size;
        }

        if (event.key === "ArrowDown" && row > 0) {
            targetIndex = emptyIndex - size;
        }

        if (targetIndex !== -1) {
            event.preventDefault();
            tryMove(targetIndex);
        }
    });

    // ================================
    // 重新开始
    // ================================

    restartBtn.addEventListener("click", initGame);

    sizeSelect.addEventListener("change", initGame);

    // 启动游戏
    initGame();

</script>

</body>
</html>
