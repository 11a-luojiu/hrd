
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数字华容道 | Number Puzzle</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #e8efff, #f7edff);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px 15px;
    color: #293858;
}

.game {
    width: 100%;
    max-width: 540px;
    background: rgba(255,255,255,0.92);
    padding: 30px;
    border-radius: 24px;
    box-shadow: 0 15px 50px rgba(76,85,130,0.13);
}

header {
    text-align: center;
    margin-bottom: 25px;
}

h1 {
    font-size: 30px;
    margin: 0 0 10px;
    letter-spacing: 2px;
}

.subtitle {
    color: #8993aa;
    font-size: 14px;
}

.settings {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
}

select, .restart {
    border: none;
    padding: 11px 15px;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
}

select {
    background: #eef1fa;
    color: #435477;
    outline: none;
}

.restart {
    background: #7189d9;
    color: white;
    transition: 0.2s;
}

.restart:hover {
    background: #536fc6;
    transform: translateY(-2px);
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
}

.stat {
    background: #f3f5fc;
    border-radius: 12px;
    padding: 13px 5px;
    text-align: center;
}

.stat-label {
    color: #939db4;
    font-size: 12px;
    margin-bottom: 7px;
}

.stat-value {
    font-size: 21px;
    font-weight: bold;
    color: #5069ae;
}

.board {
    --size: 3;
    display: grid;
    grid-template-columns: repeat(var(--size), 1fr);
    gap: 7px;
    width: 100%;
    aspect-ratio: 1;
    background: #dce3f5;
    padding: 8px;
    border-radius: 15px;
    margin-bottom: 20px;
}

.tile {
    border: none;
    border-radius: 9px;
    background: linear-gradient(145deg, #8fa7eb, #718bd7);
    color: white;
    font-size: clamp(12px, 5vw, 25px);
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 5px rgba(68,84,140,0.15);
    transition: background 0.15s, transform 0.15s;
    min-width: 0;
    padding: 0;
}

.tile:hover {
    background: #617bc9;
}

.tile:active {
    transform: scale(0.94);
}

.tile.empty {
    background: #cbd4e9;
    box-shadow: none;
    cursor: default;
}

.message {
    text-align: center;
    min-height: 25px;
    color: #7189d9;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 12px;
}

.tips {
    text-align: center;
    font-size: 12px;
    color: #a0a8ba;
    line-height: 1.8;
}

@media (max-width: 480px) {
    .game {
        padding: 20px;
    }

    h1 {
        font-size: 24px;
    }

    .board {
        gap: 4px;
        padding: 5px;
    }

    .tile {
        border-radius: 5px;
    }
}
</style>
</head>

<body>

<div class="game">

    <header>
        <h1>NUMBER PUZZLE</h1>
        <div class="subtitle">
            数字华容道 · 挑战你的逻辑思维
        </div>
    </header>

    <div class="settings">

        <select id="sizeSelect">
            <option value="3">3 × 3 · 简单</option>
            <option value="4">4 × 4 · 入门</option>
            <option value="5">5 × 5 · 普通</option>
            <option value="6">6 × 6 · 进阶</option>
            <option value="7">7 × 7 · 困难</option>
            <option value="8">8 × 8 · 挑战</option>
            <option value="9">9 × 9 · 大师</option>
        </select>

        <button class="restart" id="restart">
            重新开始
        </button>

    </div>

    <div class="stats">

        <div class="stat">
            <div class="stat-label">移动步数</div>
            <div class="stat-value" id="moves">0</div>
        </div>

        <div class="stat">
            <div class="stat-label">游戏时间</div>
            <div class="stat-value" id="timer">00:00</div>
        </div>

        <div class="stat">
            <div class="stat-label">棋盘规格</div>
            <div class="stat-value" id="level">3×3</div>
        </div>

    </div>

    <div class="board" id="board"></div>

    <div class="message" id="message">
        将数字按顺序排列，开始挑战吧！
    </div>

    <div class="tips">
        点击与空格相邻的数字即可移动<br>
        也可以使用键盘方向键操作
    </div>

</div>

<script>

// ================================
// 1. 获取页面元素
// ================================

const boardElement = document.getElementById("board");
const sizeSelect = document.getElementById("sizeSelect");
const restartButton = document.getElementById("restart");

const movesElement = document.getElementById("moves");
const timerElement = document.getElementById("timer");
const levelElement = document.getElementById("level");
const messageElement = document.getElementById("message");

// ================================
// 2. 游戏数据
// ================================

let size = 3;
let board = [];

let moves = 0;
let seconds = 0;

let timer = null;
let started = false;
let finished = false;

// ================================
// 3. 判断是否已经完成
// ================================

function checkWin() {

    for (let i = 0; i < board.length - 1; i++) {

        if (board[i] !== i + 1) {
            return false;
        }

    }

    return board[board.length - 1] === 0;
}

// ================================
// 4. 生成一个有解的随机棋盘
// ================================

function shuffleBoard() {

    board = [];

    const total = size * size;

    // 先生成正确顺序

    for (let i = 1; i < total; i++) {
        board.push(i);
    }

    board.push(0);

    let empty = total - 1;
    let previousEmpty = -1;

    // 通过合法移动打乱棋盘
    // 这样生成的棋盘一定有解

    const shuffleTimes = Math.max(150, total * 15);

    for (let i = 0; i < shuffleTimes; i++) {

        const row = Math.floor(empty / size);
        const col = empty % size;

        let candidates = [];

        if (row > 0) {
            candidates.push(empty - size);
        }

        if (row < size - 1) {
            candidates.push(empty + size);
        }

        if (col > 0) {
            candidates.push(empty - 1);
        }

        if (col < size - 1) {
            candidates.push(empty + 1);
        }

        // 避免立即走回上一步

        let available = candidates.filter(
            index => index !== previousEmpty
        );

        if (available.length === 0) {
            available = candidates;
        }

        const target = available[
            Math.floor(Math.random() * available.length)
        ];

        [board[empty], board[target]] =
        [board[target], board[empty]];

        previousEmpty = empty;
        empty = target;

    }

    // 避免出现刚好已经完成的情况

    if (checkWin()) {
        [board[0], board[1]] = [board[1], board[0]];
    }

}

// ================================
// 5. 绘制棋盘
// ================================

function renderBoard() {

    boardElement.innerHTML = "";

    boardElement.style.setProperty("--size", size);

    board.forEach((number, index) => {

        const tile = document.createElement("button");

        if (number === 0) {

            tile.className = "tile empty";
            tile.disabled = true;
            tile.setAttribute("aria-label", "空格");

        } else {

            tile.className = "tile";
            tile.textContent = number;

            tile.setAttribute("aria-label", "数字 " + number);

            tile.addEventListener("click", function() {
                moveTile(index);
            });

        }

        boardElement.appendChild(tile);

    });

}

// ================================
// 6. 判断数字能否移动
// ================================

function canMove(index) {

    const empty = board.indexOf(0);

    const row1 = Math.floor(index / size);
    const col1 = index % size;

    const row2 = Math.floor(empty / size);
    const col2 = empty % size;

    const distance =
        Math.abs(row1 - row2) +
        Math.abs(col1 - col2);

    return distance === 1;
}

// ================================
// 7. 移动数字
// ================================

function moveTile(index) {

    if (finished) return;

    if (!canMove(index)) return;

    // 第一次移动时启动计时器

    if (!started) {
        started = true;
        startTimer();
    }

    const empty = board.indexOf(0);

    // 交换数字和空格

    [board[index], board[empty]] =
    [board[empty], board[index]];

    moves++;

    updateStats();

    renderBoard();

    // 检查是否胜利

    if (checkWin()) {

        finished = true;

        clearInterval(timer);

        messageElement.textContent =
            "恭喜你！挑战成功！";

    }

}

// ================================
// 8. 键盘操作
// ================================

document.addEventListener("keydown", function(event) {

    const empty = board.indexOf(0);

    let target = -1;

    switch (event.key) {

        case "ArrowUp":
            target = empty - size;
            break;

        case "ArrowDown":
            target = empty + size;
            break;

        case "ArrowLeft":
            if (empty % size !== 0) {
                target = empty - 1;
            }
            break;

        case "ArrowRight":
            if (empty % size !== size - 1) {
                target = empty + 1;
            }
            break;

        default:
            return;

    }

    event.preventDefault();

    if (target >= 0 && target < board.length) {
        moveTile(target);
    }

});

// ================================
// 9. 计时器
// ================================

function startTimer() {

    timer = setInterval(function() {

        seconds++;

        updateStats();

    }, 1000);

}

// ================================
// 10. 更新游戏数据
// ================================

function updateStats() {

    movesElement.textContent = moves;

    const minutes = Math.floor(seconds / 60);
    const remainingSeconds = seconds % 60;

    timerElement.textContent =
        String(minutes).padStart(2, "0") +
        ":" +
        String(remainingSeconds).padStart(2, "0");

    levelElement.textContent =
        size + "×" + size;

}

// ================================
// 11. 开始新游戏
// ================================

function newGame() {

    clearInterval(timer);

    moves = 0;
    seconds = 0;

    started = false;
    finished = false;

    size = Number(sizeSelect.value);

    shuffleBoard();

    updateStats();

    renderBoard();

    messageElement.textContent =
        "将数字按顺序排列，开始挑战吧！";

}

// ================================
// 12. 绑定按钮
// ================================

restartButton.addEventListener("click", newGame);

sizeSelect.addEventListener("change", newGame);

// ================================
// 13. 初始化游戏
// ================================

newGame();

</script>

</body>
</html>
