
<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数字华容道 | Number Puzzle</title>

<style>

/* ================================
   1. 页面基础样式
================================ */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: "Microsoft YaHei", sans-serif;

    background: linear-gradient(135deg, #e8efff, #f7edff);

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 25px 15px;
    color: #293858;
}

.game {
    width: 100%;
    max-width: 540px;

    background: rgba(255,255,255,0.95);

    padding: 30px;
    border-radius: 24px;

    box-shadow: 0 15px 50px rgba(76,85,130,0.13);
}

/* ================================
   2. 标题
================================ */

header {
    text-align: center;
    margin-bottom: 25px;
}

h1 {
    font-size: 30px;
    margin: 0 0 10px;
    letter-spacing: 2px;
}

.subtitle {
    color: #8993aa;
    font-size: 14px;
}

/* ================================
   3. 游戏设置
================================ */

.settings {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
}

select,
.restart {
    border: none;
    padding: 11px 15px;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
}

select {
    background: #eef1fa;
    color: #435477;
    outline: none;
}

.restart {
    background: #7189d9;
    color: white;
    transition: 0.2s;
}

.restart:hover {
    background: #536fc6;
    transform: translateY(-2px);
}

/* ================================
   4. 数据统计
================================ */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
}

.stat {
    background: #f3f5fc;
    border-radius: 12px;
    padding: 13px 5px;
    text-align: center;
}

.stat-label {
    color: #939db4;
    font-size: 12px;
    margin-bottom: 7px;
}

.stat-value {
    font-size: 21px;
    font-weight: bold;
    color: #5069ae;
}

/* ================================
   5. 棋盘
================================ */

.board {
    --size: 3;

    display: grid;
    grid-template-columns: repeat(var(--size), 1fr);

    gap: 7px;

    width: 100%;
    aspect-ratio: 1;

    background: #dce3f5;
    padding: 8px;
    border-radius: 15px;

    margin-bottom: 20px;

    overflow: hidden;
}

.tile {
    border: none;
    border-radius: 9px;

    background: linear-gradient(145deg, #8fa7eb, #718bd7);

    color: white;
    font-size: clamp(12px, 5vw, 25px);
    font-weight: bold;

    cursor: grab;

    box-shadow: 0 3px 5px rgba(68,84,140,0.15);

    transition: transform 0.18s ease,
                background 0.15s;

    min-width: 0;
    min-height: 0;
    padding: 0;

    touch-action: none;
    user-select: none;
    -webkit-user-select: none;

    display: flex;
    justify-content: center;
    align-items: center;
}

.tile:hover {
    background: #617bc9;
}

.tile:active {
    cursor: grabbing;
}

.tile.empty {
    background: #cbd4e9;
    box-shadow: none;
    cursor: default;
}

/* ================================
   6. 提示文字
================================ */

.message {
    text-align: center;
    min-height: 25px;

    color: #7189d9;
    font-size: 14px;
    font-weight: bold;

    margin-bottom: 12px;
}

.tips {
    text-align: center;
    font-size: 12px;
    color: #a0a8ba;
    line-height: 1.8;
}

/* ================================
   7. 手机适配
================================ */

@media (max-width: 480px) {

    .game {
        padding: 20px;
    }

    h1 {
        font-size: 24px;
    }

    .board {
        gap: 4px;
        padding: 5px;
    }

    .tile {
        border-radius: 5px;
    }

}

</style>
</head>


<body>

<div class="game">

    <header>
        <h1>NUMBER PUZZLE</h1>

        <div class="subtitle">
            数字华容道 · 挑战你的逻辑思维
        </div>
    </header>


    <!-- 游戏设置 -->

    <div class="settings">

        <select id="sizeSelect">

            <option value="3">3 × 3 · 简单</option>
            <option value="4">4 × 4 · 入门</option>
            <option value="5">5 × 5 · 普通</option>
            <option value="6">6 × 6 · 进阶</option>
            <option value="7">7 × 7 · 困难</option>
            <option value="8">8 × 8 · 挑战</option>
            <option value="9">9 × 9 · 大师</option>

        </select>

        <button class="restart" id="restart">
            重新开始
        </button>

    </div>


    <!-- 游戏数据 -->

    <div class="stats">

        <div class="stat">

            <div class="stat-label">移动步数</div>

            <div class="stat-value" id="moves">
                0
            </div>

        </div>

        <div class="stat">

            <div class="stat-label">游戏时间</div>

            <div class="stat-value" id="timer">
                00:00
            </div>

        </div>

        <div class="stat">

            <div class="stat-label">棋盘规格</div>

            <div class="stat-value" id="level">
                3×3
            </div>

        </div>

    </div>


    <!-- 游戏棋盘 -->

    <div class="board" id="board"></div>


    <!-- 游戏提示 -->

    <div class="message" id="message">
        将数字按顺序排列，开始挑战吧！
    </div>

    <div class="tips">
        电脑：按住方块拖动<br>
        手机：手指滑动方块<br>
        也可以点击相邻数字或使用方向键
    </div>

</div>


<script>

// =====================================
// 1. 获取页面元素
// =====================================

const boardElement = document.getElementById("board");

const sizeSelect = document.getElementById("sizeSelect");

const restartButton = document.getElementById("restart");

const movesElement = document.getElementById("moves");

const timerElement = document.getElementById("timer");

const levelElement = document.getElementById("level");

const messageElement = document.getElementById("message");


// =====================================
// 2. 游戏数据
// =====================================

let size = 3;

let board = [];

let moves = 0;

let seconds = 0;

let timer = null;

let animationTimeout = null;

let started = false;

let finished = false;

let isAnimating = false;


// =====================================
// 3. 判断游戏是否胜利
// =====================================

function checkWin() {

    for (let i = 0; i < board.length - 1; i++) {

        if (board[i] !== i + 1) {

            return false;

        }

    }

    return board[board.length - 1] === 0;

}


// =====================================
// 4. 随机生成有解棋盘
// =====================================

function shuffleBoard() {

    board = [];

    const total = size * size;

    // 生成正确顺序

    for (let i = 1; i < total; i++) {

        board.push(i);

    }

    board.push(0);

    let empty = total - 1;

    let previousEmpty = -1;

    const shuffleTimes = Math.max(150, total * 15);

    // 通过合法移动打乱棋盘

    for (let i = 0; i < shuffleTimes; i++) {

        const row = Math.floor(empty / size);

        const col = empty % size;

        let candidates = [];

        if (row > 0) {
            candidates.push(empty - size);
        }

        if (row < size - 1) {
            candidates.push(empty + size);
        }

        if (col > 0) {
            candidates.push(empty - 1);
        }

        if (col < size - 1) {
            candidates.push(empty + 1);
        }

        // 避免立即走回上一步

        let available = candidates.filter(
            index => index !== previousEmpty
        );

        if (available.length === 0) {

            available = candidates;

        }

        const target = available[
            Math.floor(Math.random() * available.length)
        ];

        // 交换空格和目标数字

        [board[empty], board[target]] =
        [board[target], board[empty]];

        previousEmpty = empty;

        empty = target;

    }

    // 避免随机结果恰好已经完成

    if (checkWin()) {

        [board[0], board[1]] =
        [board[1], board[0]];

    }

}


// =====================================
// 5. 绘制棋盘
// =====================================

function renderBoard() {

    boardElement.innerHTML = "";

    boardElement.style.setProperty("--size", size);

    board.forEach((number, index) => {

        const tile = document.createElement("button");

        if (number === 0) {

            tile.className = "tile empty";

            tile.disabled = true;

            tile.setAttribute("aria-label", "空格");

        } else {

            tile.className = "tile";

            tile.textContent = number;

            tile.setAttribute("aria-label", "数字 " + number);

            let startX = 0;

            let startY = 0;

            let isDragging = false;


            // 鼠标或手指按下

            tile.addEventListener("pointerdown", function(event) {

                if (event.pointerType === "mouse" && event.button !== 0) {
                    return;
                }

                if (isAnimating || finished) return;

                startX = event.clientX;

                startY = event.clientY;

                isDragging = true;

                tile.style.transition = "none";

                tile.setPointerCapture(event.pointerId);

            });


            // 拖动过程中，让方块跟随鼠标或手指

            tile.addEventListener("pointermove", function(event) {

                if (!isDragging || isAnimating || finished) return;

                const dx = event.clientX - startX;

                const dy = event.clientY - startY;

                tile.style.transform =
                    `translate(${dx}px, ${dy}px)`;

            });


            // 松开鼠标或手指

            tile.addEventListener("pointerup", function(event) {

                if (!isDragging) return;

                isDragging = false;

                if (isAnimating || finished) return;

                const dx = event.clientX - startX;

                const dy = event.clientY - startY;

                // 判断是否只是点击

                if (Math.max(Math.abs(dx), Math.abs(dy)) < 12) {

                    tile.style.transition = "";

                    tile.style.transform = "";

                    slideTile(index);

                    return;

                }

                let target = index;

                // 判断主要滑动方向

                if (Math.abs(dx) > Math.abs(dy)) {

                    if (dx > 0) {

                        target = index + 1;

                    } else {

                        target = index - 1;

                    }

                } else {

                    if (dy > 0) {

                        target = index + size;

                    } else {

                        target = index - size;

                    }

                }

                // 判断目标是否在棋盘范围内

                if (target < 0 || target >= board.length) {

                    tile.style.transition = "";

                    tile.style.transform = "";

                    return;

                }

                // 防止左右跨行

                if (
                    Math.abs(dx) > Math.abs(dy) &&
                    Math.floor(target / size) !== Math.floor(index / size)
                ) {

                    tile.style.transition = "";

                    tile.style.transform = "";

                    return;

                }

                // 只有空格在滑动方向上才允许移动

                if (target === board.indexOf(0)) {

                    slideTile(index, dx, dy);

                } else {

                    // 不合法时，方块回到原位

                    tile.style.transition = "transform 0.18s ease";

                    tile.style.transform = "";

                    setTimeout(() => {

                        tile.style.transition = "";

                    }, 180);

                }

            });


            // 手指意外取消操作

            tile.addEventListener("pointercancel", function() {

                isDragging = false;

                tile.style.transition = "transform 0.18s ease";

                tile.style.transform = "";

                setTimeout(() => {

                    tile.style.transition = "";

                }, 180);

            });

        }

        boardElement.appendChild(tile);

    });

}


// =====================================
// 6. 判断数字能否移动
// =====================================

function canMove(index) {

    const empty = board.indexOf(0);

    const row1 = Math.floor(index / size);

    const col1 = index % size;

    const row2 = Math.floor(empty / size);

    const col2 = empty % size;

    const distance =
        Math.abs(row1 - row2) +
        Math.abs(col1 - col2);

    return distance === 1;

}


// =====================================
// 7. 滑动动画
// =====================================

function slideTile(index, dragX = 0, dragY = 0) {

    if (finished || isAnimating) return;

    if (!canMove(index)) return;

    const empty = board.indexOf(0);

    const tiles = boardElement.children;

    const currentTile = tiles[index];

    const emptyTile = tiles[empty];

    // 获取空格位置

    const currentRect = currentTile.getBoundingClientRect();

    const emptyRect = emptyTile.getBoundingClientRect();

    const dx = emptyRect.left - currentRect.left;

    const dy = emptyRect.top - currentRect.top;

    isAnimating = true;

    // 让方块从拖动位置平滑滑入空格

    currentTile.style.transition = "transform 0.18s ease";

    currentTile.style.transform =
        `translate(${dx}px, ${dy}px)`;

    // 等待动画结束

    animationTimeout = setTimeout(function() {

        // 交换数字和空格

        [board[index], board[empty]] =
        [board[empty], board[index]];

        // 第一次移动时启动计时器

        if (!started) {

            started = true;

            startTimer();

        }

        moves++;

        isAnimating = false;

        updateStats();

        renderBoard();

        // 检查胜利

        if (checkWin()) {

            finished = true;

            clearInterval(timer);

            messageElement.textContent =
                "恭喜你！挑战成功！";

        }

    }, 180);

}


// =====================================
// 8. 键盘方向键操作
// =====================================

document.addEventListener("keydown", function(event) {

    if (finished || isAnimating) return;

    const empty = board.indexOf(0);

    let target = -1;

    switch (event.key) {

        case "ArrowUp":

            target = empty - size;

            break;

        case "ArrowDown":

            target = empty + size;

            break;

        case "ArrowLeft":

            if (empty % size !== 0) {

                target = empty - 1;

            }

            break;

        case "ArrowRight":

            if (empty % size !== size - 1) {

                target = empty + 1;

            }

            break;

        default:

            return;

    }

    event.preventDefault();

    if (target >= 0 && target < board.length) {

        slideTile(target);

    }

});


// =====================================
// 9. 计时器
// =====================================

function startTimer() {

    timer = setInterval(function() {

        seconds++;

        updateStats();

    }, 1000);

}


// =====================================
// 10. 更新数据
// =====================================

function updateStats() {

    movesElement.textContent = moves;

    const minutes = Math.floor(seconds / 60);

    const remainingSeconds = seconds % 60;

    timerElement.textContent =
        String(minutes).padStart(2, "0") +
        ":" +
        String(remainingSeconds).padStart(2, "0");

    levelElement.textContent =
        size + "×" + size;

}


// =====================================
// 11. 开始新游戏
// =====================================

function newGame() {

    // 清除旧计时器和动画

    clearInterval(timer);

    clearTimeout(animationTimeout);

    // 重置数据

    moves = 0;

    seconds = 0;

    started = false;

    finished = false;

    isAnimating = false;

    // 读取棋盘规格

    size = Number(sizeSelect.value);

    // 生成新棋盘

    shuffleBoard();

    updateStats();

    renderBoard();

    messageElement.textContent =
        "将数字按顺序排列，开始挑战吧！";

}


// =====================================
// 12. 绑定按钮
// =====================================

restartButton.addEventListener("click", newGame);

sizeSelect.addEventListener("change", newGame);


// =====================================
// 13. 初始化游戏
// =====================================

newGame();

</script>

</body>
</html>
